<svg viewBox="0 0 120 120" fill="none" xmlns="http://www.w3.org/2000/svg">
  <g transform="rotate(-38 60 60)">
    <!-- Green arrow: top arc, head pointing down/right (swipe right = green) -->
    <path d="M30 52 A30 30 0 0 1 90 52" stroke="#62b84b" stroke-width="12" stroke-linecap="round"/>
    <path d="M83 44 L99 50 L86 63 Z" fill="#62b84b"/>
    <!-- Red arrow: 180° rotation -->
    <g transform="rotate(180 60 60)">
      <path d="M30 52 A30 30 0 0 1 90 52" stroke="#e05c52" stroke-width="12" stroke-linecap="round"/>
      <path d="M83 44 L99 50 L86 63 Z" fill="#e05c52"/>
    </g>
  </g>
</svg>
